<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<title>Motorrad Live</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #f4f5f7;
    --karte: #ffffff;
    --text: #15181d;
    --leise: #5d6570;
    --linie: #e3e6ea;
    --gruen: #12924f;
    --gelb: #c98a00;
    --rot: #d0362b;
    --akzent: #1f6feb;
    --schatten: 0 6px 24px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --karte: #1a1f26;
      --text: #eef1f4;
      --leise: #9aa3ad;
      --linie: #2a313a;
      --gruen: #3ccf7e;
      --gelb: #f0b429;
      --rot: #ff6b5e;
      --akzent: #5aa2ff;
      --schatten: 0 6px 24px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  #karte { flex: 1; min-height: 45vh; }
  .leaflet-container { background: var(--bg); }
  /* dunkler Rand um die Strecke, damit sie auch auf Satellitenbildern gut sichtbar ist */
  .leaflet-overlay-pane path { filter: drop-shadow(0 0 1.5px rgba(0,0,0,.9)); }
  @media (prefers-color-scheme: dark) {
    .kacheln-strasse { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }
  }
  .leaflet-top.leaflet-right { top: max(56px, calc(env(safe-area-inset-top) + 46px)); }

  #kopf {
    position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 500;
    display: flex; gap: 8px; align-items: center; pointer-events: none;
  }
  #status {
    pointer-events: auto; display: flex; align-items: center; gap: 8px;
    background: var(--karte); border-radius: 999px; padding: 8px 14px; box-shadow: var(--schatten);
    font-weight: 600; max-width: 100%;
  }
  #status .punkt { width: 10px; height: 10px; border-radius: 50%; background: var(--leise); flex: none; }
  #status.live .punkt { background: var(--gruen); animation: puls 1.6s infinite; }
  #status.pause .punkt { background: var(--gelb); }
  #status.weg .punkt { background: var(--rot); }
  #status small { font-weight: 400; color: var(--leise); }
  @keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(18,146,79,.6); } 70% { box-shadow: 0 0 0 9px rgba(18,146,79,0); } 100% { box-shadow: 0 0 0 0 rgba(18,146,79,0); } }

  #panel {
    background: var(--karte); border-top: 1px solid var(--linie);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 24px rgba(0,0,0,.08);
  }
  #gross { display: flex; align-items: baseline; gap: 18px; margin-bottom: 12px; flex-wrap: wrap; }
  #tempo { font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1; font-variant-numeric: tabular-nums; }
  #tempo span { font-size: 16px; font-weight: 600; color: var(--leise); margin-left: 4px; letter-spacing: 0; }
  #ort { color: var(--leise); font-size: 14px; flex: 1; min-width: 140px; }
  .raster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .wert { background: var(--bg); border-radius: 12px; padding: 9px 10px; }
  .wert b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .wert small { color: var(--leise); font-size: 12px; }
  .knoepfe { display: flex; gap: 8px; margin-top: 12px; }
  .knoepfe button, .knoepfe a {
    flex: 1; text-align: center; border: 0; border-radius: 12px; padding: 11px 8px; font: inherit; font-weight: 600;
    background: var(--bg); color: var(--text); text-decoration: none; cursor: pointer;
  }
  .knoepfe .an { background: var(--akzent); color: #fff; }

  .moto {
    width: 38px; height: 38px; border-radius: 50%; background: var(--karte); border: 3px solid var(--akzent);
    display: grid; place-items: center; font-size: 20px; box-shadow: var(--schatten);
  }
  .moto.alt { border-color: var(--leise); filter: grayscale(.6); }
  .start { width: 14px; height: 14px; border-radius: 50%; background: var(--gruen); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }

  .foto-pin { width: 46px; height: 46px; border-radius: 10px; border: 3px solid #fff; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.5); background: #ddd; }
  .foto-pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #fotos { margin-top: 12px; display: none; }
  #fotos h2 { font-size: 13px; font-weight: 600; color: var(--leise); margin: 0 0 6px; }
  #fotoleiste { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  #fotoleiste button { flex: none; width: 72px; height: 72px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--bg); }
  #fotoleiste img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #gross-foto { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.92); display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 16px; color: #fff; }
  #gross-foto.zeigen { display: flex; }
  #gross-foto img { max-width: 100%; max-height: calc(100% - 110px); object-fit: contain; border-radius: 8px; }
  #gross-foto .unter { margin-top: 12px; text-align: center; max-width: 640px; }
  #gross-foto .unter small { color: #bbb; }
  #gross-foto .zu, #gross-foto .pfeil { position: absolute; border: 0; background: rgba(255,255,255,.15); color: #fff;
    width: 48px; height: 48px; border-radius: 50%; font-size: 24px; cursor: pointer; }
  #gross-foto .zu { top: max(14px, env(safe-area-inset-top)); right: 14px; }
  #gross-foto .pfeil { top: 50%; transform: translateY(-50%); }
  #gross-foto .zurueck { left: 10px; } #gross-foto .vor { right: 10px; }
  #hinweis { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 1500; background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-weight: 600; box-shadow: var(--schatten); display: none; cursor: pointer;
    max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tagleiste { display: flex; align-items: center; gap: 6px; margin: -2px 0 12px; }
  #tagleiste .nav { flex: none; width: 38px; height: 38px; border: 0; border-radius: 10px; background: var(--bg); color: var(--text); font-size: 20px; cursor: pointer; }
  #tagleiste .nav:disabled { opacity: .3; cursor: default; }
  #tag-titel { flex: 1; min-width: 0; text-align: center; line-height: 1.2; }
  #tag-titel b { display: block; font-size: 16px; }
  #tag-titel small { color: var(--leise); font-size: 13px; }
  #buch-knopf { flex: none; border: 0; border-radius: 10px; padding: 0 12px; height: 38px; font: inherit; font-weight: 600; background: var(--bg); color: var(--text); cursor: pointer; }
  #buch { position: fixed; inset: 0; z-index: 1800; background: var(--bg); overflow-y: auto; display: none; }
  #buch.zeigen { display: block; }
  #buch .innen { max-width: 640px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  #buch header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  #buch h1 { font-size: 24px; margin: 0; flex: 1; }
  #buch .zu { border: 0; border-radius: 50%; width: 42px; height: 42px; font-size: 20px; background: var(--karte); color: var(--text); cursor: pointer; }
  #buch-summe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  #buch-summe div { background: var(--karte); border-radius: 12px; padding: 10px; }
  #buch-summe b { display: block; font-size: 20px; }
  #buch-summe small { color: var(--leise); font-size: 12px; }
  .tagkarte { display: block; width: 100%; text-align: left; border: 0; font: inherit; color: inherit; cursor: pointer;
    background: var(--karte); border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .tagkarte.aktiv { outline: 2px solid var(--akzent); }
  .tagkarte h2 { font-size: 17px; margin: 0 0 2px; }
  .tagkarte h2 small { font-weight: 400; color: var(--leise); font-size: 14px; margin-left: 6px; }
  .tagkarte .zahlen { color: var(--leise); font-size: 14px; }
  .tagkarte .bilder { display: flex; gap: 6px; margin-top: 10px; overflow: hidden; }
  .tagkarte .bilder img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; background: var(--bg); }
  #buch .leer { color: var(--leise); text-align: center; padding: 30px 0; }
  #kommentare { margin-top: 14px; }
  #kommentare h2 { font-size: 13px; font-weight: 600; color: var(--leise); margin: 0 0 6px; }
  #k-liste { display: grid; gap: 8px; max-height: 260px; overflow-y: auto; margin-bottom: 8px; }
  #k-liste:empty::before { content: "Noch keine Kommentare. Schreib den ersten! 👋"; color: var(--leise); font-size: 14px; }
  .k { background: var(--bg); border-radius: 12px; padding: 8px 10px; display: flex; gap: 10px; align-items: flex-start; }
  .k.fahrer { background: color-mix(in srgb, var(--akzent) 14%, var(--bg)); }
  .k .inhalt { flex: 1; min-width: 0; }
  .k b { font-size: 14px; }
  .k small { color: var(--leise); font-size: 12px; margin-left: 6px; }
  .k p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .k .mini { flex: none; width: 40px; height: 40px; border-radius: 8px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: var(--linie); }
  .k .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #k-form input { width: 100%; border: 1px solid var(--linie); border-radius: 12px; padding: 11px 12px; font: inherit; background: var(--karte); color: var(--text); }
  .k-zeile { display: flex; gap: 8px; }
  .k-zeile input { flex: 1; min-width: 0; }
  .k-zeile button, #k-als button { border: 0; border-radius: 12px; padding: 0 16px; font: inherit; font-weight: 600; background: var(--akzent); color: #fff; cursor: pointer; }
  #k-als { font-size: 13px; color: var(--leise); margin: 0 0 6px; }
  #k-als button { background: none; color: var(--akzent); padding: 0; font-weight: 600; }
  #k-name { margin-bottom: 8px; }
  #k-foto { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--leise); margin-bottom: 6px; }
  #k-foto img { width: 32px; height: 32px; object-fit: cover; border-radius: 6px; }
  #k-foto button { border: 0; background: none; color: var(--leise); font-size: 16px; cursor: pointer; }
  #k-fehler { color: var(--rot); font-size: 13px; }
  #gross-foto .k-knopf { margin-top: 10px; border: 0; border-radius: 999px; padding: 9px 16px; font: inherit; font-weight: 600; background: rgba(255,255,255,.18); color: #fff; cursor: pointer; }
  #gross-foto .foto-k { margin-top: 8px; font-size: 14px; color: #ddd; text-align: left; max-height: 120px; overflow-y: auto; }
  #gross-foto .foto-k div { margin-top: 3px; }
  @media (max-width: 899px) { #panel { max-height: 58vh; overflow-y: auto; } }
  #meldung { position: fixed; inset: 0; z-index: 1000; display: none; place-items: center; background: var(--bg); padding: 24px; text-align: center; }
  #meldung.zeigen { display: grid; }
  #meldung div { max-width: 360px; }
  #meldung h1 { font-size: 22px; margin: 10px 0; }
  #meldung p { color: var(--leise); }

  @media (min-width: 900px) {
    body { flex-direction: row; }
    #karte { height: 100%; }
    #panel { width: 380px; border-top: 0; border-left: 1px solid var(--linie); overflow-y: auto; }
  }
</style>
</head>
<body>
<div id="kopf"><div id="status"><span class="punkt"></span><span id="statustext">Verbinde …</span></div></div>
<div id="karte"></div>
<div id="panel">
  <div id="tagleiste">
    <button class="nav" id="tag-zurueck" type="button" aria-label="Vorheriger Tag">‹</button>
    <div id="tag-titel"><b id="tag-name">Heute</b><small id="tag-datum"></small></div>
    <button class="nav" id="tag-vor" type="button" aria-label="Nächster Tag">›</button>
    <button id="buch-knopf" type="button">📖 Reisebuch</button>
  </div>
  <div id="gross">
    <div id="tempo">–<span>km/h</span></div>
    <div id="ort">Warte auf erste Position …</div>
  </div>
  <div class="raster">
    <div class="wert"><b id="w-km">–</b><small>gefahren</small></div>
    <div class="wert"><b id="w-fahrzeit">–</b><small>Fahrzeit</small></div>
    <div class="wert"><b id="w-schnitt">–</b><small>Ø km/h</small></div>
    <div class="wert"><b id="w-max">–</b><small>max. km/h</small></div>
    <div class="wert"><b id="w-hoehe">–</b><small>Höhe</small></div>
    <div class="wert"><b id="w-akku">–</b><small>Handy-Akku</small></div>
  </div>
  <div id="fotos"><h2 id="fotos-titel">Fotos</h2><div id="fotoleiste"></div></div>
  <div id="kommentare">
    <h2 id="k-titel">💬 Kommentare</h2>
    <div id="k-liste"></div>
    <form id="k-form" autocomplete="off">
      <div id="k-foto" hidden><img alt=""><span>Kommentar zu diesem Foto</span><button type="button" aria-label="Foto entfernen">✕</button></div>
      <p id="k-als" hidden>als <b id="k-als-name"></b> · <button type="button" id="k-name-aendern">ändern</button></p>
      <input id="k-name" maxlength="40" placeholder="Dein Name" aria-label="Dein Name">
      <div class="k-zeile">
        <input id="k-text" maxlength="500" placeholder="Kommentar schreiben …" aria-label="Kommentar">
        <button type="submit">Senden</button>
      </div>
      <small id="k-fehler"></small>
    </form>
  </div>
  <div class="knoepfe">
    <button id="folgen" class="an" type="button">📍 Folgen</button>
    <button id="ganze" type="button">🗺️ Ganze Strecke</button>
    <a id="gmaps" href="#" target="_blank" rel="noopener">Google Maps</a>
  </div>
</div>
<div id="gross-foto" role="dialog" aria-label="Foto">
  <button class="zu" type="button" aria-label="Schließen">✕</button>
  <button class="pfeil zurueck" type="button" aria-label="Vorheriges Foto">‹</button>
  <button class="pfeil vor" type="button" aria-label="Nächstes Foto">›</button>
  <img alt="">
  <div class="unter"><div class="text"></div><small class="zeit"></small>
    <div class="foto-k"></div>
    <button class="k-knopf" type="button">💬 Kommentieren</button></div>
</div>
<div id="buch" role="dialog" aria-label="Reisebuch"><div class="innen">
  <header><h1>📖 Reisebuch</h1><button class="zu" type="button" aria-label="Schließen">✕</button></header>
  <div id="buch-summe"></div>
  <div id="buch-tage"></div>
</div></div>
<div id="hinweis">📷 Neues Foto</div>
<div id="meldung"><div><div style="font-size:48px">🏍️</div><h1 id="m-titel"></h1><p id="m-text"></p></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(() => {
  const API = "https://qdqtvaoqhhecoeqvxsqq.supabase.co/functions/v1/motorrad-tour";
  const INTERVALL_MS = 10000;
  const LIVE_BIS_MIN = 2;      // jünger als 2 Min = live
  const SIGNAL_WEG_MIN = 30;   // älter als 30 Min = rot

  const $ = (id) => document.getElementById(id);
  const token = (location.hash.slice(1) || new URLSearchParams(location.search).get("t") || "").trim();

  function meldung(titel, text) {
    $("m-titel").textContent = titel;
    $("m-text").textContent = text;
    $("meldung").classList.add("zeigen");
  }
  if (!token) { meldung("Kein Zugang", "Bitte den vollständigen Link verwenden, den du bekommen hast."); return; }

  const karte = L.map("karte", { zoomControl: false, attributionControl: true }).setView([51.1, 10.4], 6);
  L.control.zoom({ position: "bottomright" }).addTo(karte);
  // Kartenbilder ohne API-Schlüssel. Der Schlüssel hinter "#" wird nie mitgeschickt.
  const osmText = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const ebenen = {
    "Straße": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, className: "kacheln-strasse", attribution: osmText }),
    "Gelände": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
      maxZoom: 17, attribution: osmText + ', <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)' }),
    "Satellit": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Bilder &copy; Esri" }),
  };
  let ebeneName = "Satellit";
  try { const g = localStorage.getItem("karte"); if (g && ebenen[g]) ebeneName = g; } catch (e) {}
  ebenen[ebeneName].addTo(karte);
  L.control.layers(ebenen, null, { position: "topright" }).addTo(karte);
  karte.on("baselayerchange", (e) => { try { localStorage.setItem("karte", e.name); } catch (err) {} });

  const streckenGruppe = L.layerGroup().addTo(karte);
  let motoMarker = null, startMarker = null;
  let alle = [];     // alle geladenen Punkte
  let punkte = [];   // nur die aktuelle Tour
  let folgen = true;
  let ersteAnsicht = true;
  let fehlerZaehler = 0;
  let cursor = null;
  let fotoCursor = 0;
  let fotos = [];          // alle geladenen Fotos
  const fotoMarker = {};   // id -> Leaflet-Marker
  let ersterAbruf = true;
  const fotoGruppe = L.layerGroup().addTo(karte);
  let kCursor = 0;
  let kommentare = [];
  const eigeneKommentare = new Set();
  let kFoto = null;
  // Tage: angezeigter Tag (JJJJ-MM-TT), heutiger Tag der Reise und Liste aller Tage fürs Reisebuch
  let tag = null, heute = null, tage = [];
  try { const t = new URLSearchParams(location.search).get("tag"); if (/^\d{4}-\d{2}-\d{2}$/.test(t || "")) tag = t; } catch (e) {}
  const istHeute = () => !tag || tag === heute;

  // ---------- Hilfsfunktionen ----------
  const rad = (g) => g * Math.PI / 180;
  function abstandKm(a, b) {
    const R = 6371, dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const zeit = (p) => new Date(p.t).getTime();
  function dauerText(ms) {
    const min = Math.round(ms / 60000);
    if (min < 60) return min + " min";
    return Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0");
  }
  function vorText(ms) {
    const s = Math.round(ms / 1000);
    if (s < 60) return "gerade eben";
    const m = Math.round(s / 60);
    if (m < 60) return "vor " + m + " Min.";
    return "vor " + dauerText(ms);
  }
  const uhr = (d) => new Date(d).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  function farbe(kmh) {
    if (kmh == null) return "#8892a0";
    if (kmh < 30) return "#2bb673";
    if (kmh < 60) return "#9acd32";
    if (kmh < 90) return "#f0b429";
    if (kmh < 120) return "#f77f00";
    return "#d0362b";
  }

  // ---------- Auswertung ----------
  function brauchbar(p) { return p.genau == null || p.genau <= 60; }

  function auswerten() {
    const gut = punkte.filter(brauchbar);
    let km = 0, fahrMs = 0, max = 0;
    for (let i = 1; i < gut.length; i++) {
      const a = gut[i - 1], b = gut[i];
      const dt = zeit(b) - zeit(a);
      if (dt <= 0) continue;
      const d = abstandKm(a, b);
      const v = d / (dt / 3600000);
      if (v > 300) continue;                 // GPS-Sprung ignorieren
      if (d > 0.005) km += d;                // Zittern im Stand ignorieren
      if (dt < 3 * 60000 && (v > 4 || (b.kmh ?? 0) > 4)) fahrMs += dt;
      if (b.kmh != null && b.kmh > max && b.kmh < 300) max = b.kmh;
    }
    return { km, fahrMs, max, schnitt: fahrMs > 60000 ? km / (fahrMs / 3600000) : null };
  }

  // Seit wann steht er still? (Punkte im Umkreis von 80 m)
  function standSeit() {
    if (punkte.length < 2) return null;
    const letzter = punkte[punkte.length - 1];
    let seit = zeit(letzter);
    for (let i = punkte.length - 2; i >= 0; i--) {
      if (abstandKm(punkte[i], letzter) > 0.08) break;
      seit = zeit(punkte[i]);
    }
    return zeit(letzter) - seit > 3 * 60000 ? seit : null;
  }

  // ---------- Zeichnen ----------
  function streckeZeichnen() {
    streckenGruppe.clearLayers();
    const gut = punkte.filter(brauchbar);
    if (gut.length < 2) return;
    let seg = [[gut[0].lat, gut[0].lng]], segFarbe = farbe(gut[1].kmh);
    for (let i = 1; i < gut.length; i++) {
      const f = farbe(gut[i].kmh);
      const p = [gut[i].lat, gut[i].lng];
      // Lücken (Funkloch) gestrichelt verbinden
      if (zeit(gut[i]) - zeit(gut[i - 1]) > 5 * 60000) {
        L.polyline(seg, { color: segFarbe, weight: 5, opacity: .9 }).addTo(streckenGruppe);
        L.polyline([seg[seg.length - 1], p], { color: "#8892a0", weight: 3, dashArray: "6 8" }).addTo(streckenGruppe);
        seg = [p]; segFarbe = f; continue;
      }
      seg.push(p);
      if (f !== segFarbe) {
        L.polyline(seg, { color: segFarbe, weight: 5, opacity: .9 }).addTo(streckenGruppe);
        seg = [p]; segFarbe = f;
      }
    }
    if (seg.length > 1) L.polyline(seg, { color: segFarbe, weight: 5, opacity: .9 }).addTo(streckenGruppe);
  }

  function markerSetzen(alt) {
    const p = punkte[punkte.length - 1];
    const icon = L.divIcon({ className: "", html: '<div class="moto' + (alt ? " alt" : "") + '">🏍️</div>', iconSize: [38, 38], iconAnchor: [19, 19] });
    if (!motoMarker) motoMarker = L.marker([p.lat, p.lng], { icon, zIndexOffset: 1000 }).addTo(karte);
    else { motoMarker.setLatLng([p.lat, p.lng]); motoMarker.setIcon(icon); }
    motoMarker.bindTooltip("Zuletzt: " + uhr(p.t));

    const s = punkte[0];
    const sIcon = L.divIcon({ className: "", html: '<div class="start"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
    if (!startMarker) startMarker = L.marker([s.lat, s.lng], { icon: sIcon }).addTo(karte).bindTooltip("Start " + uhr(s.t));
    else startMarker.setLatLng([s.lat, s.lng]).setTooltipContent("Start " + uhr(s.t));
  }

  function beschriftung(rueckblick) {
    $("w-hoehe").nextElementSibling.textContent = rueckblick ? "höchster Punkt" : "Höhe";
    $("w-akku").nextElementSibling.textContent = rueckblick ? "Akku am Ende" : "Handy-Akku";
  }
  function werteLeeren() {
    for (const id of ["w-km", "w-fahrzeit", "w-schnitt", "w-max", "w-hoehe", "w-akku"]) $(id).textContent = "–";
    $("tempo").innerHTML = "–<span>km/h</span>";
  }

  function anzeigen() {
    tagleisteZeichnen();
    beschriftung(!istHeute());
    $("folgen").hidden = !istHeute();
    if (!punkte.length) {
      $("status").className = "";
      $("statustext").innerHTML = istHeute() ? "Heute noch keine Fahrt <small>· warte auf Start</small>" : "📖 Rückblick <small>· keine Strecke an diesem Tag</small>";
      $("ort").textContent = istHeute() ? "Sobald Traccar sendet, erscheint hier die Strecke." : "";
      werteLeeren();
      fotosZeichnen();
      if (ersteAnsicht && fotos.length) { karte.fitBounds(L.latLngBounds(fotos.filter((f) => f.lat != null).map((f) => [f.lat, f.lng])), { padding: [60, 60], maxZoom: 14 }); ersteAnsicht = false; }
      return;
    }
    if (!istHeute()) { rueckblickAnzeigen(); return; }
    const letzter = punkte[punkte.length - 1];
    const alterMs = Date.now() - zeit(letzter);
    const live = alterMs < LIVE_BIS_MIN * 60000;
    const stand = standSeit();

    const st = $("status"), tx = $("statustext");
    // Hinweis: Traccar sendet im Stillstand nichts, um Akku zu sparen.
    // Keine neuen Punkte heißt daher meist "Pause", manchmal "Funkloch".
    if (alterMs > SIGNAL_WEG_MIN * 60000) {
      st.className = "weg";
      tx.innerHTML = "Länger keine Meldung <small>· letzte " + uhr(letzter.t) + " Uhr</small>";
    } else if (live && !stand) {
      st.className = "live";
      tx.innerHTML = "Live unterwegs <small>· " + vorText(alterMs) + "</small>";
    } else {
      const seit = stand ? Date.now() - stand : alterMs;
      st.className = "pause";
      tx.innerHTML = "Pause / Stillstand <small>· seit " + dauerText(Math.max(seit, 60000)) + "</small>";
    }

    const kmh = live && letzter.kmh != null && !stand ? Math.round(letzter.kmh) : null;
    $("tempo").innerHTML = (kmh == null ? "–" : kmh) + "<span>km/h</span>";
    $("ort").textContent = "Letzte Position " + uhr(letzter.t) + " Uhr · unterwegs seit " + uhr(punkte[0].t);

    const a = auswerten();
    $("w-km").textContent = a.km.toFixed(a.km < 10 ? 1 : 0).replace(".", ",") + " km";
    $("w-fahrzeit").textContent = dauerText(a.fahrMs);
    $("w-schnitt").textContent = a.schnitt ? Math.round(a.schnitt) : "–";
    $("w-max").textContent = a.max >= 1 ? Math.round(a.max) : "–";
    $("w-hoehe").textContent = letzter.hoehe != null ? Math.round(letzter.hoehe) + " m" : "–";
    $("w-akku").textContent = letzter.akku != null ? Math.round(letzter.akku) + " %" + (letzter.laedt ? " ⚡" : "") : "–";
    $("gmaps").href = "https://www.google.com/maps/search/?api=1&query=" + letzter.lat + "," + letzter.lng;

    markerSetzen(!live);
    streckeZeichnen();
    fotosZeichnen();
    if (ersteAnsicht) { ganzeStrecke(); ersteAnsicht = false; }
    else if (folgen) karte.panTo([letzter.lat, letzter.lng], { animate: true });
  }

  // Vergangener Tag: Tageszusammenfassung statt Live-Werten
  function rueckblickAnzeigen() {
    const a = auswerten();
    const erster = punkte[0], letzter = punkte[punkte.length - 1];
    $("status").className = "";
    $("statustext").innerHTML = "📖 Rückblick <small>· " + uhr(erster.t) + "–" + uhr(letzter.t) + " Uhr</small>";
    $("tempo").innerHTML = a.km.toFixed(a.km < 10 ? 1 : 0).replace(".", ",") + "<span>km</span>";
    $("ort").textContent = "unterwegs von " + uhr(erster.t) + " bis " + uhr(letzter.t) + " Uhr";
    $("w-km").textContent = a.km.toFixed(a.km < 10 ? 1 : 0).replace(".", ",") + " km";
    $("w-fahrzeit").textContent = dauerText(a.fahrMs);
    $("w-schnitt").textContent = a.schnitt ? Math.round(a.schnitt) : "–";
    $("w-max").textContent = a.max >= 1 ? Math.round(a.max) : "–";
    const hoehen = punkte.map((p) => p.hoehe).filter((x) => x != null);
    $("w-hoehe").textContent = hoehen.length ? Math.round(Math.max(...hoehen)) + " m" : "–";
    $("w-akku").textContent = letzter.akku != null ? Math.round(letzter.akku) + " %" : "–";
    $("gmaps").href = "https://www.google.com/maps/search/?api=1&query=" + letzter.lat + "," + letzter.lng;
    markerSetzen(true);
    streckeZeichnen();
    fotosZeichnen();
    if (ersteAnsicht) { ganzeStrecke(); ersteAnsicht = false; }
  }

  // ---------- Tage und Reisebuch ----------
  const datumText = (d, lang) => new Date(d + "T12:00:00").toLocaleDateString("de-DE",
    lang ? { weekday: "long", day: "numeric", month: "long" } : { weekday: "short", day: "numeric", month: "short" });
  function tagListe() {
    const liste = tage.map((t) => t.datum);
    if (heute && !liste.includes(heute)) liste.push(heute);
    if (tag && !liste.includes(tag)) liste.push(tag);
    return liste.sort();
  }
  function tagNummer(d) {
    const t = tage.find((x) => x.datum === d);
    if (t) return t.nr;
    if (d === heute && tage.length && heute > tage[tage.length - 1].datum) return tage.length + 1;
    return null;
  }
  function tagleisteZeichnen() {
    const d = tag || heute;
    if (!d) return;
    const nr = tagNummer(d);
    $("tag-name").textContent = (nr ? "Tag " + nr : (d === heute ? "Heute" : "Tag")) + (d === heute && nr ? " · heute" : "");
    $("tag-datum").textContent = datumText(d, false);
    const liste = tagListe(), i = liste.indexOf(d);
    $("tag-zurueck").disabled = i <= 0;
    $("tag-vor").disabled = i < 0 || i >= liste.length - 1;
  }
  function wechsleTag(d) {
    if (!d || d === (tag || heute)) return;
    tag = d === heute ? null : d;
    try {
      const u = new URL(location.href);
      if (tag) u.searchParams.set("tag", tag); else u.searchParams.delete("tag");
      history.replaceState(null, "", u.toString());
    } catch (e) {}
    neuLaden();
  }
  // alles vom vorherigen Tag zurücksetzen und den gewählten Tag laden
  function neuLaden() {
    alle = []; punkte = []; fotos = []; kommentare = [];
    cursor = null; fotoCursor = 0; kCursor = 0;
    streckenGruppe.clearLayers(); fotoGruppe.clearLayers();
    for (const id in fotoMarker) delete fotoMarker[id];
    if (motoMarker) { karte.removeLayer(motoMarker); motoMarker = null; }
    if (startMarker) { karte.removeLayer(startMarker); startMarker = null; }
    ersteAnsicht = true; ersterAbruf = true;
    folgen = istHeute(); $("folgen").classList.toggle("an", folgen);
    kFotoSetzen(null);
    kommentareZeichnen(); fotosZeichnen(); werteLeeren(); tagleisteZeichnen();
    $("statustext").textContent = "Lade …";
    laden();
  }
  $("tag-zurueck").onclick = () => { const l = tagListe(), i = l.indexOf(tag || heute); if (i > 0) wechsleTag(l[i - 1]); };
  $("tag-vor").onclick = () => { const l = tagListe(), i = l.indexOf(tag || heute); if (i >= 0 && i < l.length - 1) wechsleTag(l[i + 1]); };

  async function tageLaden() {
    try {
      const r = await fetch(API + "?ansicht=" + encodeURIComponent(token) + "&tage=1", { cache: "no-store" });
      if (!r.ok) return;
      const d = await r.json();
      tage = d.tage; heute = d.heute;
      tagleisteZeichnen();
      if ($("buch").classList.contains("zeigen")) buchZeichnen();
    } catch (e) {}
  }
  function buchZeichnen() {
    const summe = tage.reduce((s, t) => ({ km: s.km + t.km, fz: s.fz + t.fahrzeit_s, fotos: s.fotos + t.fotos, k: s.k + t.kommentare,
      max: Math.max(s.max, t.max_kmh || 0) }), { km: 0, fz: 0, fotos: 0, k: 0, max: 0 });
    const kachel = (wert, text) => { const d = document.createElement("div"); const b = document.createElement("b"); b.textContent = wert;
      const s = document.createElement("small"); s.textContent = text; d.append(b, s); return d; };
    $("buch-summe").replaceChildren(
      kachel(tage.length, tage.length === 1 ? "Tag" : "Tage"),
      kachel(Math.round(summe.km).toLocaleString("de-DE") + " km", "gefahren"),
      kachel(dauerText(summe.fz * 1000), "Fahrzeit"),
      kachel(summe.max ? summe.max : "–", "max. km/h"),
      kachel(summe.fotos, "Fotos"),
      kachel(summe.k, "Kommentare"));
    const liste = $("buch-tage");
    liste.textContent = "";
    if (!tage.length) {
      const p = document.createElement("p"); p.className = "leer";
      p.textContent = "Noch keine Tage. Sobald die erste Fahrt beginnt, entsteht hier das Reisebuch. 🏍️";
      liste.appendChild(p); return;
    }
    for (const t of tage.slice().reverse()) {
      const k = document.createElement("button");
      k.type = "button"; k.className = "tagkarte" + (t.datum === (tag || heute) ? " aktiv" : "");
      const h2 = document.createElement("h2"); h2.textContent = "Tag " + t.nr;
      const sm = document.createElement("small"); sm.textContent = datumText(t.datum, true) + (t.datum === heute ? " · heute" : "");
      h2.appendChild(sm);
      const z = document.createElement("div"); z.className = "zahlen";
      const teile = [];
      if (t.km > 0.05) teile.push(t.km.toFixed(t.km < 10 ? 1 : 0).replace(".", ",") + " km");
      if (t.fahrzeit_s > 60) teile.push(dauerText(t.fahrzeit_s * 1000) + " Fahrzeit");
      if (t.max_kmh) teile.push("max. " + t.max_kmh + " km/h");
      if (t.start && t.ende) teile.push(uhr(t.start) + "–" + uhr(t.ende) + " Uhr");
      if (t.fotos) teile.push("📷 " + t.fotos);
      if (t.kommentare) teile.push("💬 " + t.kommentare);
      z.textContent = teile.join(" · ") || "keine Strecke";
      k.append(h2, z);
      if (t.foto_ids.length) {
        const b = document.createElement("div"); b.className = "bilder";
        for (const id of t.foto_ids) { const img = document.createElement("img"); img.alt = ""; img.loading = "lazy"; img.src = fotoUrl(id, true); b.appendChild(img); }
        k.appendChild(b);
      }
      k.onclick = () => { $("buch").classList.remove("zeigen"); wechsleTag(t.datum); };
      liste.appendChild(k);
    }
  }
  $("buch-knopf").onclick = () => { buchZeichnen(); $("buch").classList.add("zeigen"); tageLaden(); };
  $("buch").querySelector(".zu").onclick = () => $("buch").classList.remove("zeigen");

  function ganzeStrecke() {
    if (!punkte.length) return;
    if (punkte.length === 1) { karte.setView([punkte[0].lat, punkte[0].lng], 14); return; }
    karte.fitBounds(L.latLngBounds(punkte.map((p) => [p.lat, p.lng])), { padding: [60, 60], maxZoom: 15 });
  }

  // ---------- Fotos ----------
  const fotoUrl = (id, klein) => API + "?ansicht=" + encodeURIComponent(token) + "&foto=" + id + (klein ? "&klein=1" : "");
  function tourFotos() {
    return fotos;
  }
  function fotosZeichnen() {
    const sichtbar = tourFotos();
    const ids = new Set(sichtbar.map((f) => f.id));
    for (const id in fotoMarker) if (!ids.has(Number(id))) { fotoGruppe.removeLayer(fotoMarker[id]); delete fotoMarker[id]; }
    for (const f of sichtbar) {
      if (fotoMarker[f.id] || f.lat == null) continue;
      const icon = L.divIcon({ className: "", html: '<div class="foto-pin"><img alt="" src="' + fotoUrl(f.id, true) + '"></div>', iconSize: [46, 46], iconAnchor: [23, 23] });
      fotoMarker[f.id] = L.marker([f.lat, f.lng], { icon, zIndexOffset: 500 }).addTo(fotoGruppe).on("click", () => fotoZeigen(f.id));
    }
    const leiste = $("fotoleiste");
    leiste.textContent = "";
    for (const f of sichtbar.slice().reverse()) {
      const b = document.createElement("button");
      b.type = "button"; b.title = f.titel || "Foto " + uhr(f.t);
      const img = document.createElement("img"); img.alt = f.titel || "Foto"; img.loading = "lazy"; img.src = fotoUrl(f.id, true);
      b.appendChild(img); b.onclick = () => fotoZeigen(f.id);
      leiste.appendChild(b);
    }
    $("fotos").style.display = sichtbar.length ? "block" : "none";
    $("fotos-titel").textContent = sichtbar.length === 1 ? "1 Foto" : sichtbar.length + " Fotos";
  }
  let aktuellesFoto = null;
  function fotoZeigen(id) {
    const liste = tourFotos(), i = liste.findIndex((f) => f.id === id);
    if (i < 0) return;
    const f = liste[i];
    aktuellesFoto = id;
    const box = $("gross-foto");
    box.querySelector("img").src = fotoUrl(f.id, false);
    box.querySelector(".text").textContent = f.titel || "";
    box.querySelector(".zeit").textContent = uhr(f.t) + " Uhr";
    fotoKommentareZeigen();
    box.querySelector(".zurueck").style.visibility = i > 0 ? "visible" : "hidden";
    box.querySelector(".vor").style.visibility = i < liste.length - 1 ? "visible" : "hidden";
    box.classList.add("zeigen");
    if (f.lat != null) { folgen = false; $("folgen").classList.remove("an"); karte.setView([f.lat, f.lng], Math.max(karte.getZoom(), 14)); }
  }
  function fotoBlaettern(r) {
    const liste = tourFotos(), i = liste.findIndex((f) => f.id === aktuellesFoto);
    if (liste[i + r]) fotoZeigen(liste[i + r].id);
  }
  const fotoZu = () => $("gross-foto").classList.remove("zeigen");
  $("gross-foto").querySelector(".zu").onclick = fotoZu;
  $("gross-foto").querySelector(".zurueck").onclick = (e) => { e.stopPropagation(); fotoBlaettern(-1); };
  $("gross-foto").querySelector(".vor").onclick = (e) => { e.stopPropagation(); fotoBlaettern(1); };
  $("gross-foto").onclick = (e) => { if (e.target.id === "gross-foto") fotoZu(); };
  document.addEventListener("keydown", (e) => {
    if (!$("gross-foto").classList.contains("zeigen")) return;
    if (e.key === "Escape") fotoZu();
    if (e.key === "ArrowLeft") fotoBlaettern(-1);
    if (e.key === "ArrowRight") fotoBlaettern(1);
  });
  // ---------- Kommentare ----------
  function fotoKommentareZeigen() {
    const box = $("gross-foto").querySelector(".foto-k");
    box.textContent = "";
    for (const k of kommentare.filter((k) => k.foto_id === aktuellesFoto)) {
      const d = document.createElement("div");
      const b = document.createElement("b"); b.textContent = (k.fahrer ? "🏍️ " : "") + k.name + ": ";
      d.append(b, document.createTextNode(k.text));
      box.appendChild(d);
    }
  }
  function kommentareZeichnen() {
    const liste = $("k-liste");
    const unten = liste.scrollHeight - liste.scrollTop - liste.clientHeight < 40;
    liste.textContent = "";
    for (const k of kommentare) {
      const el = document.createElement("div");
      el.className = "k" + (k.fahrer ? " fahrer" : "");
      if (k.foto_id) {
        const m = document.createElement("button");
        m.type = "button"; m.className = "mini"; m.title = "Foto ansehen";
        const img = document.createElement("img"); img.alt = "Foto"; img.loading = "lazy"; img.src = fotoUrl(k.foto_id, true);
        m.appendChild(img); m.onclick = () => fotoZeigen(k.foto_id);
        el.appendChild(m);
      }
      const inhalt = document.createElement("div"); inhalt.className = "inhalt";
      const b = document.createElement("b"); b.textContent = (k.fahrer ? "🏍️ " : "") + k.name;
      const s = document.createElement("small"); s.textContent = uhr(k.t);
      const p = document.createElement("p"); p.textContent = k.text;
      inhalt.append(b, s, p);
      el.appendChild(inhalt);
      liste.appendChild(el);
    }
    if (unten) liste.scrollTop = liste.scrollHeight;
    $("k-titel").textContent = "💬 Kommentare" + (kommentare.length ? " (" + kommentare.length + ")" : "");
    if ($("gross-foto").classList.contains("zeigen")) fotoKommentareZeigen();
  }

  let meinName = "";
  try { meinName = localStorage.getItem("kommentarName") || ""; } catch (e) {}
  function nameAnzeigen() {
    $("k-name").hidden = !!meinName;
    $("k-als").hidden = !meinName;
    $("k-als-name").textContent = meinName;
  }
  nameAnzeigen();
  $("k-name-aendern").onclick = () => { $("k-name").value = meinName; meinName = ""; nameAnzeigen(); $("k-name").focus(); };

  function kFotoSetzen(id) {
    kFoto = id;
    $("k-foto").hidden = !id;
    if (id) $("k-foto").querySelector("img").src = fotoUrl(id, true);
  }
  $("k-foto").querySelector("button").onclick = () => kFotoSetzen(null);
  $("gross-foto").querySelector(".k-knopf").onclick = (e) => {
    e.stopPropagation();
    kFotoSetzen(aktuellesFoto);
    fotoZu();
    $("kommentare").scrollIntoView({ behavior: "smooth", block: "end" });
    (meinName ? $("k-text") : $("k-name")).focus();
  };

  let sendet = false;
  $("k-form").onsubmit = async (e) => {
    e.preventDefault();
    if (sendet) return;
    const name = (meinName || $("k-name").value).trim();
    const text = $("k-text").value.trim();
    $("k-fehler").textContent = "";
    if (!name) { $("k-fehler").textContent = "Bitte gib deinen Namen ein."; $("k-name").focus(); return; }
    if (!text) { $("k-text").focus(); return; }
    sendet = true;
    try {
      const r = await fetch(API + "?ansicht=" + encodeURIComponent(token) + "&kommentar=1", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, text, foto_id: kFoto, tag: tag || heute }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.fehler || "Senden fehlgeschlagen");
      eigeneKommentare.add(d.id);
      meinName = name;
      try { localStorage.setItem("kommentarName", name); } catch (err) {}
      nameAnzeigen();
      $("k-text").value = "";
      kFotoSetzen(null);
      $("k-liste").scrollTop = $("k-liste").scrollHeight;
      laden();
    } catch (err) {
      $("k-fehler").textContent = err.message + " – bitte nochmal versuchen.";
    } finally { sendet = false; }
  };

  let hinweisTimer;
  function neuesFotoHinweis(id) {
    hinweis("📷 Neues Foto", () => fotoZeigen(id));
  }
  function hinweis(text, aktion) {
    const h = $("hinweis");
    h.textContent = text;
    h.style.display = "block";
    h.onclick = () => { h.style.display = "none"; aktion(); };
    clearTimeout(hinweisTimer);
    hinweisTimer = setTimeout(() => { h.style.display = "none"; }, 15000);
  }

  // ---------- Daten laden ----------
  async function laden() {
    const angefragt = tag;
    const url = API + "?ansicht=" + encodeURIComponent(token) + (tag ? "&datum=" + tag : "")
      + (cursor ? "&seit=" + encodeURIComponent(cursor) : "")
      + (fotoCursor ? "&fotos_seit=" + fotoCursor : "")
      + (kCursor ? "&kommentare_seit=" + kCursor : "");
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (r.status === 403) { meldung("Link ungültig", "Dieser Link funktioniert nicht (mehr)."); return; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      if (angefragt !== tag) return;   // inzwischen anderer Tag gewählt
      const altHeute = heute;
      heute = d.heute;
      if (altHeute && altHeute !== heute) {   // Mitternacht: neuer Tag beginnt
        tageLaden();
        if (!tag) { neuLaden(); return; }
      }
      if (d.positionen.length) {
        const bekannt = new Set(alle.map((p) => p.t));
        for (const p of d.positionen) if (!bekannt.has(p.t)) { alle.push(p); bekannt.add(p.t); }
        alle.sort((a, b) => zeit(a) - zeit(b));
        punkte = alle;
      }
      if (d.cursor) cursor = d.cursor;
      if (d.fotos && d.fotos.length) {
        const bekannteFotos = new Set(fotos.map((f) => f.id));
        const neue = d.fotos.filter((f) => !bekannteFotos.has(f.id));
        fotos = fotos.concat(neue).sort((a, b) => zeit(a) - zeit(b));
        if (!ersterAbruf && neue.length) neuesFotoHinweis(neue[neue.length - 1].id);
      }
      if (d.fotos_cursor) fotoCursor = d.fotos_cursor;
      if (d.kommentare && d.kommentare.length) {
        const bekannt = new Set(kommentare.map((k) => k.id));
        const neu = d.kommentare.filter((k) => !bekannt.has(k.id));
        kommentare = kommentare.concat(neu).sort((a, b) => a.id - b.id);
        const fremd = neu.filter((k) => !eigeneKommentare.has(k.id));
        if (!ersterAbruf && fremd.length) {
          const k = fremd[fremd.length - 1];
          const kurz = k.text.length > 40 ? k.text.slice(0, 40) + "…" : k.text;
          hinweis("💬 " + (k.fahrer ? "🏍️ " : "") + k.name + ": " + kurz, () => $("kommentare").scrollIntoView({ behavior: "smooth" }));
        }
        kommentareZeichnen();
      }
      if (d.kommentare_cursor) kCursor = d.kommentare_cursor;
      ersterAbruf = false;
      fehlerZaehler = 0;
      anzeigen();
    } catch (e) {
      fehlerZaehler++;
      if (fehlerZaehler >= 3) {
        $("status").className = "weg";
        $("statustext").innerHTML = "Keine Verbindung <small>· prüfe dein Internet</small>";
      }
    }
  }

  $("folgen").onclick = () => {
    folgen = !folgen;
    $("folgen").classList.toggle("an", folgen);
    if (folgen && punkte.length) karte.setView([punkte.at(-1).lat, punkte.at(-1).lng], Math.max(karte.getZoom(), 13));
  };
  $("ganze").onclick = () => {
    folgen = false; $("folgen").classList.remove("an"); ganzeStrecke();
  };
  karte.on("dragstart", () => { folgen = false; $("folgen").classList.remove("an"); });

  laden();
  tageLaden();
  setInterval(laden, INTERVALL_MS);
  setInterval(tageLaden, 5 * 60000);
  setInterval(() => { if (punkte.length) anzeigen(); }, 30000);  // "vor X Min." aktuell halten
  document.addEventListener("visibilitychange", () => { if (!document.hidden) laden(); });
})();
</script>
</body>
</html>
